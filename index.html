<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간편 가계부</title>
    <!-- Chart.js 및 FontAwesome -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        banksalad: {
                            green: '#00C73C',
                            dark: '#0F172A',
                            bg: '#F8FAFC',
                        }
                    }
                }
            }
        }</script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { display: none; }</style>
</head>
<body class="bg-slate-100 flex justify-center min-h-screen">

    <div class="w-full max-w-md bg-banksalad-bg min-h-screen flex flex-col relative shadow-xl">
        <!-- 헤더 -->
        <header class="bg-white sticky top-0 z-10 px-5 py-4 flex items-center justify-between shadow-sm">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-banksalad-green rounded-lg flex items-center justify-center text-white font-bold text-lg">
                    B
                </div>
                <span class="font-bold text-xl text-slate-900 tracking-tight">banksalad</span>
            </div>
            <button onclick="fetchDataFromSheet(true)" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-full font-medium transition flex items-center gap-1">
                <i id="sync-icon" class="fa-solid fa-rotate-right"></i>
                <span>동기화</span>
            </button>
        </header>

        <!-- 메인 콘텐츠 영역 -->
        <main class="flex-1 p-5 pb-24 overflow-y-auto">

            <!-- 1. 입력 뷰 (수입/지출 선택 가능) -->
            <section id="view-input" class="view active">
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">

                    <!-- 수입 / 지출 토글 탭 -->
                    <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
                        <button type="button" id="type-expense-btn" onclick="setTransactionType('지출')"
                                class="flex-1 py-2 text-sm font-bold rounded-lg bg-white text-slate-900 shadow-sm transition-all">
                            지출
                        </button>
                        <button type="button" id="type-income-btn" onclick="setTransactionType('수입')"
                                class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 transition-all">
                            수입
                        </button>
                    </div>

                    <form id="expense-form" onsubmit="handleExpenseSubmit(event)" class="space-y-6">
                        <!-- 금액 입력 -->
                        <div>
                            <label id="amount-label" class="block text-sm font-medium text-slate-500 mb-2">얼마를 쓰셨나요?</label>
                            <div class="relative">
                                <input type="number" id="input-amount" placeholder="0" required
                                       class="w-full text-right text-3xl font-bold text-slate-900 border-b-2 border-slate-200 focus:border-banksalad-green focus:outline-none pb-2 pr-8 bg-transparent transition-colors placeholder:text-slate-300">
                                <span class="absolute right-0 bottom-3 text-lg font-bold text-slate-900">원</span>
                            </div>
                        </div>

                        <!-- 카테고리 선택 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-500 mb-2">카테고리</label>
                            <div class="grid grid-cols-3 gap-3" id="category-container">
                                <!-- 자바스크립트에서 수입/지출에 따라 동적 생성 -->
                            </div>
                        </div>

                        <!-- 메모/내용 입력 -->
                        <div>
                            <label class="block text-sm font-medium text-slate-500 mb-2">사용처 / 내용</label>
                            <input type="text" id="input-desc" placeholder="예: 점심 식사, 월급 등"
                                   class="w-full text-sm font-medium text-slate-900 border-b border-slate-200 focus:border-banksalad-green focus:outline-none py-2 bg-transparent">
                        </div>

                        <button type="submit" id="submit-btn" class="w-full bg-banksalad-green hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-md transition-colors mt-4 flex justify-center items-center">
                            <span>저장하기</span>
                        </button>
                    </form>
                </div>
            </section>

            <!-- 2. 내역 뷰 (수입/지출 구분 표시) -->
            <section id="view-weekly" class="view">
                <div class="flex justify-between items-end mb-4">
                    <h3 class="text-xl font-bold text-slate-900">전체 내역</h3>
                    <span id="total-count" class="text-sm text-slate-500">총 0건</span>
                </div>

                <div id="weekly-expense-list" class="space-y-3">
                    <div class="text-center py-10 text-slate-400">데이터를 불러오는 중입니다...</div>
                </div>
            </section>

            <!-- 3. 월별 통계 뷰 (수입 vs 지출 요약 리포트) -->
            <section id="view-monthly" class="view">
                <h3 class="text-xl font-bold text-slate-900 mb-4">월별 소비 리포트</h3>

                <!-- 수입/지출 총 요약 카드 -->
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <p class="text-xs font-semibold text-blue-500 mb-1">총 수입</p>
                        <p id="monthly-income-total" class="text-lg font-bold text-slate-900">0원</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <p class="text-xs font-semibold text-rose-500 mb-1">총 지출</p>
                        <p id="monthly-expense-total" class="text-lg font-bold text-slate-900">0원</p>
                    </div>
                </div>

                <!-- 지출 카테고리 차트 -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-sm font-bold text-slate-800 mb-3">지출 카테고리 분석</p>
                    <div class="relative h-60 w-full">
                        <canvas id="barChart"></canvas>
                    </div>
                </div>
            </section>

        </main>

        <!-- 하단 탭 바 -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-slate-100 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
            <div class="flex justify-around items-center py-2 px-2">
                <button class="nav-item w-16 py-2 flex flex-col items-center gap-1 text-banksalad-green font-bold" data-target="input" onclick="switchTab('input', this)">
                    <i class="fa-solid fa-plus-circle text-xl"></i>
                    <span class="text-[10px]">입력</span>
                </button>
                <button class="nav-item w-16 py-2 flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition" data-target="weekly" onclick="switchTab('weekly', this)">
                    <i class="fa-solid fa-list-check text-xl"></i>
                    <span class="text-[10px]">내역</span>
                </button>
                <button class="nav-item w-16 py-2 flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition" data-target="monthly" onclick="switchTab('monthly', this)">
                    <i class="fa-solid fa-chart-pie text-xl"></i>
                    <span class="text-[10px]">월별 통계</span>
                </button>
            </div>
        </nav>
    </div>

    <script>
        // =========================================================
        // ⚠️ 본인의 Google Apps Script 웹 앱 URL을 입력하세요.
        // =========================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyXFMfevUrlpaxuTK5VMEPLgsAJt_UgUcYh50G5jXX9nCQ7Pk_cVHVungt4MI50efYr/exec";

        let currentType = '지출'; // '지출' 또는 '수입'
        let currentCategory = '';
        let localExpenseData = [];
        let chartInstance = null;

        // 카테고리 옵션 정의
        const categories = {
            '지출': [
                { name: '식비', icon: 'fa-utensils', bg: 'bg-orange-50', text: 'text-orange-500' },
                { name: '교통', icon: 'fa-bus', bg: 'bg-blue-50', text: 'text-blue-500' },
                { name: '쇼핑', icon: 'fa-bag-shopping', bg: 'bg-purple-50', text: 'text-purple-500' },
                { name: '주거', icon: 'fa-house', bg: 'bg-emerald-50', text: 'text-emerald-500' },
                { name: '여가', icon: 'fa-film', bg: 'bg-pink-50', text: 'text-pink-500' },
                { name: '기타', icon: 'fa-box', bg: 'bg-slate-100', text: 'text-slate-500' }
            ],
            '수입': [
                { name: '월급', icon: 'fa-money-bill-wave', bg: 'bg-green-50', text: 'text-green-600' },
                { name: '부수입', icon: 'fa-chart-line', bg: 'bg-cyan-50', text: 'text-cyan-600' },
                { name: '용돈', icon: 'fa-hand-holding-dollar', bg: 'bg-amber-50', text: 'text-amber-600' },
                { name: '금융', icon: 'fa-piggy-bank', bg: 'bg-indigo-50', text: 'text-indigo-600' },
                { name: '기타', icon: 'fa-wallet', bg: 'bg-slate-100', text: 'text-slate-500' }
            ]
        };

        // 수입/지출 선택 토글
        function setTransactionType(type){
            currentType = type;
            const expenseBtn = document.getElementById('type-expense-btn');
            const incomeBtn = document.getElementById('type-income-btn');
            const amountLabel = document.getElementById('amount-label');

            if (type === '지출') {
                expenseBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white text-slate-900 shadow-sm transition-all";
                incomeBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 transition-all";
                amountLabel.textContent = "얼마를 쓰셨나요?";
            } else {
                incomeBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-white text-blue-600 shadow-sm transition-all";
                expenseBtn.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-400 transition-all";
                amountLabel.textContent = "얼마를 버셨나요?";
            }

            renderCategoryGrid();
        }

        // 카테고리 그리드 UI 생성
        function renderCategoryGrid(){
            const container = document.getElementById('category-container');
            container.innerHTML = '';
            currentCategory = '';

            categories[currentType].forEach(cat => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'category-btn border-2 border-slate-100 bg-slate-50 rounded-xl py-3 flex flex-col items-center gap-1.5 transition-all';
                btn.onclick = () => selectCategory(btn, cat.name);
                btn.innerHTML = `
                    <i class="fa-solid ${cat.icon} text-slate-400 text-lg"></i>
                    <span class="text-xs font-medium text-slate-600">${cat.name}</span>
                `;
                container.appendChild(btn);
            });
        }

        // 카테고리 선택
        function selectCategory(element, categoryName){
            currentCategory = categoryName;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = 'category-btn border-2 border-slate-100 bg-slate-50 rounded-xl py-3 flex flex-col items-center gap-1.5 transition-all';
                btn.querySelector('i').classList.replace('text-banksalad-green', 'text-slate-400');
                btn.querySelector('span').classList.replace('text-banksalad-green', 'text-slate-600');
                btn.querySelector('span').classList.remove('font-bold');
            });

            element.className = 'category-btn border-2 border-banksalad-green bg-green-50 rounded-xl py-3 flex flex-col items-center gap-1.5 transition-all shadow-sm';
            element.querySelector('i').classList.replace('text-slate-400', 'text-banksalad-green');
            element.querySelector('span').classList.replace('text-slate-600', 'text-banksalad-green');
            element.querySelector('span').classList.add('font-bold');
        }

        // 탭 전환시 자동 연동
        function switchTab(tabId, element){
            document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
            document.getElementById('view-' + tabId).classList.add('active');

            document.querySelectorAll('.nav-item').forEach(nav => {
                nav.className = 'nav-item w-16 py-2 flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition';
            });
            element.className = 'nav-item w-16 py-2 flex flex-col items-center gap-1 text-banksalad-green font-bold';

            if(tabId === 'weekly') renderExpenseList();
            if(tabId === 'monthly') renderChart();
        }

        // 구글 시트 저장 (POST)
        async function handleExpenseSubmit(e){
            e.preventDefault();
            const amountInput = document.getElementById('input-amount');
            const descInput = document.getElementById('input-desc');
            const submitBtn = document.getElementById('submit-btn');

            if (!currentCategory) {
                alert('카테고리를 선택해주세요!');
                return;
            }

            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];

            const payload = {
                type: currentType,
                date: dateStr,
                category: currentCategory,
                amount: Number(amountInput.value),
                description: descInput.value || `${currentCategory} ${currentType}`,
                paymentMethod: currentType === '지출' ? '카드' : '계좌이체'
            };

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> 저장 중...`;

            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert('저장되었습니다!');

                // 로컬 데이터 즉시 업데이트
                localExpenseData.unshift(payload);

                // Form reset
                amountInput.value = '';
                descInput.value = '';

                switchTab('weekly', document.querySelector('.nav-item[data-target="weekly"]'));
            } catch (error) {
                alert('저장 중 오류가 발생했습니다.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>저장하기</span>`;
            }
        }

        // 구글 시트 데이터 불러오기 (GET)
        async function fetchDataFromSheet(showAlert = false){
            if(!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                if(showAlert) alert('GOOGLE_SCRIPT_URL을 설정해주세요.');
                return;
            }

            const syncIcon = document.getElementById('sync-icon');
            syncIcon.classList.add('fa-spin');

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();

                if (Array.isArray(data)) {
                    localExpenseData = data;
                    renderExpenseList();
                    renderChart();
                    if(showAlert) alert('최신 데이터가 동기화되었습니다.');
                }
            } catch (error) {
                console.error('동기화 실패:', error);
                if(showAlert) alert('동기화에 실패했습니다. Apps Script 배포 상태를 확인해주세요.');
            } finally {
                syncIcon.classList.remove('fa-spin');
            }
        }

        // 내역 리스트 렌더링 (수입/지출 구분 표시)
        function renderExpenseList(){
            const listContainer = document.getElementById('weekly-expense-list');
            const totalCountEl = document.getElementById('total-count');

            totalCountEl.textContent = `총 ${localExpenseData.length}건`;

            if (localExpenseData.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-10 text-slate-400">내역이 없습니다.</div>`;
                return;
            }

            listContainer.innerHTML = localExpenseData.map(item => {
                const isIncome = item.type === '수입';
                const categoryList = categories[isIncome ? '수입' : '지출'];
                const matchedCat = categoryList.find(c => c.name === item.category) || { icon: 'fa-wallet', bg: 'bg-slate-100', text: 'text-slate-500' };

                const formattedAmount = Number(item.amount).toLocaleString();
                const amountClass = isIncome ? 'text-blue-600 font-bold' : 'text-slate-900 font-bold';
                const prefix = isIncome ? '+' : '-';

                return `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                        <div class="flex items-center space-x-4">
                            <div class="w-11 h-11 ${matchedCat.bg} rounded-full flex items-center justify-center ${matchedCat.text}">
                                <i class="fa-solid ${matchedCat.icon}"></i>
                            </div>
                            <div>
                                <div class="font-bold text-slate-900">${item.description || item.category}</div>
                                <div class="text-xs text-slate-400 mt-0.5">${item.date} • <span class="${isIncome ? 'text-blue-500 font-medium' : ''}">${item.type}</span> (${item.category})</div>
                            </div>
                        </div>
                        <div class="${amountClass}">${prefix}${formattedAmount}원</div>
                    </div>
                `;
            }).join('');
        }

        // 차트 및 월별 통계 렌더링
        function renderChart(){
            const ctx = document.getElementById('barChart').getContext('2d');

            let totalIncome = 0;
            let totalExpense = 0;
            const categoryExpenseTotals = { '식비': 0, '교통': 0, '쇼핑': 0, '주거': 0, '여가': 0, '기타': 0 };

            localExpenseData.forEach(item => {
                const amt = Number(item.amount) || 0;
                if (item.type === '수입') {
                    totalIncome += amt;
                } else {
                    totalExpense += amt;
                    if (categoryExpenseTotals[item.category] !== undefined) {
                        categoryExpenseTotals[item.category] += amt;
                    } else {
                        categoryExpenseTotals['기타'] += amt;
                    }
                }
            });

            // 상단 요약 업데이트
            document.getElementById('monthly-income-total').textContent = `+${totalIncome.toLocaleString()}원`;
            document.getElementById('monthly-expense-total').textContent = `-${totalExpense.toLocaleString()}원`;

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(categoryExpenseTotals),
                    datasets: [{
                        data: Object.values(categoryExpenseTotals),
                        backgroundColor: '#00C73C',
                        borderRadius: 6,
                        barThickness: 18
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { borderDash: [2, 2] },
                            ticks: { callback: value => value >= 10000 ? (value/10000) + '만' : value }
                        },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        // 초기화
        window.onload = () => {
            renderCategoryGrid();
            fetchDataFromSheet();
        };</script>
</body>
</html>
